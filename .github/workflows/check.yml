name: Check
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  bundle-size:
    name: Bundle size
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          # On a pull request HEAD is the merge commit and HEAD^1 is the base it merges into.
          fetch-depth: 2
      - name: Install dependencies
        uses: ./.github/actions/setup
      - run: pnpm build
      - name: Measure PR base
        if: github.event_name == 'pull_request'
        # A base that cannot be measured leaves no file, and the report shows absolute sizes only.
        continue-on-error: true
        run: |
          mkdir -p "$RUNNER_TEMP/bundle-size"
          git worktree add --detach "$RUNNER_TEMP/bundle-base" HEAD^1
          cd "$RUNNER_TEMP/bundle-base"
          pnpm install
          pnpm build
          env -u GITHUB_STEP_SUMMARY pnpm bundle-size --json "$RUNNER_TEMP/bundle-size/base.json"
      - name: Report bundle size
        run: |
          dir="$RUNNER_TEMP/bundle-size"
          mkdir -p "$dir"
          args=(--json "$dir/head.json")
          if [[ -f "$dir/base.json" ]]; then args+=(--base "$dir/base.json"); fi
          pnpm bundle-size "${args[@]}"
      # Fork PRs get a read-only token here, so the Bundle size comment workflow posts the sizes.
      - name: Upload sizes
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: bundle-size
          path: ${{ runner.temp }}/bundle-size
          retention-days: 7
          if-no-files-found: error
